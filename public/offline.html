<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>You are offline — Elayo Family</title>
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #f5f7fa; color: #182c43; font-family: Poppins, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    main { width: min(380px, 100% - 40px); padding: 36px 28px; background: #fff; border: 1px solid #e7ecf1; border-radius: 18px; text-align: center; display: grid; gap: 12px; justify-items: center; }
    img { width: 84px; height: 84px; }
    h1 { margin: 6px 0 0; font-size: 21px; letter-spacing: -.3px; }
    p { margin: 0; color: #758193; font-size: 14px; line-height: 1.6; }
    button { margin-top: 10px; min-height: 44px; padding: 0 22px; border: 0; border-radius: 10px; background: #0057d9; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #0046ae; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="Elayo Family">
    <h1>You are offline</h1>
    <p>Connect to the internet to see your savings and statements.</p>
    <p lang="rw">Nta murandasi uhari. Ongera ugerageze umaze kuwubona.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>window.addEventListener("online", () => location.reload());</script>
</body>
</html>
