# Local development database. Start with: docker compose up -d db
services:
  db:
    image: postgres:17-alpine
    container_name: ikimina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ikimina
      POSTGRES_PASSWORD: ikimina
      POSTGRES_DB: ikimina
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - ikimina-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ikimina -d ikimina"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ikimina-pgdata:
